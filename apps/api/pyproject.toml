[project]
name = "growixa-api"
version = "0.1.0"
description = "Growixa backend — FastAPI modular monolith"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "redis>=5.1",
    "aio-pika>=9.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "cryptography>=43.0",
    "aiosmtplib>=3.0",
    # Instagram Graph API OAuth exchange + Supabase Storage REST calls (Slice 5,
    # GRX-SOCIAL-003/005) — was dev-only (test client), now needed at runtime too.
    "httpx>=0.27",
    # MX/A record lookups for email_validation's free hygiene checks (GRX-SAAS-016).
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    # Pinned exact, not >= : CI (`pip install -e ".[dev]"`) has no lock file to pin
    # transitively, so an unpinned mypy floated to newer releases across merges and
    # started flagging unrelated pre-existing code (confirmed: `main` CI red on the
    # last 3 merges before this pin, all for mypy-only reasons). Bump deliberately.
    "mypy==1.18.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growixa_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's Depends()/Query()/etc. in argument defaults is the framework's own required
# dependency-injection pattern, not the mutable-default-argument bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# growixa_api.db's async engine/connection pool is a module-level singleton shared across
# the whole test process; a session-scoped loop keeps every test on the same event loop so
# pooled asyncpg connections aren't handed to a different loop than the one that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
addopts = "--cov=growixa_api --cov-report=term-missing"
# !! CRITICAL: always target the isolated test DB, never the live dev `growixa` database.
# Tests run fixture teardowns that DELETE rows (users, contacts, templates).
# Without this, running pytest wipes all dev seed data.
env = ["ENVIRONMENT=test"]
markers = [
    "integration: exercises a real backing service (Postgres/Redis/RabbitMQ) — not a pure unit test; run alone via -m integration or exclude via -m 'not integration'",
]

[tool.coverage.run]
source = ["growixa_api"]
omit = ["*/tests/*"]
# SQLAlchemy's async engine bridges into the sync DBAPI driver via greenlet_spawn; without
# this, coverage.py's tracer doesn't follow into that greenlet context and under-reports
# lines that demonstrably executed (found while validating GRX-AUTH-002 — auth/services.py
# showed 50% coverage despite every line being exercised by passing, assertion-heavy tests).
concurrency = ["greenlet"]
