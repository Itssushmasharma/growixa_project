[project]
name = "growixa-worker"
version = "0.1.0"
description = "Growixa background job worker"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic-settings>=2.6",
    "aio-pika>=9.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growixa_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "--cov=growixa_worker --cov-report=term-missing"
markers = [
    "integration: exercises a real backing service (RabbitMQ) — not a pure unit test; run alone via -m integration or exclude via -m 'not integration'",
]

[tool.coverage.run]
source = ["growixa_worker"]
omit = ["*/tests/*"]
