[project]
name = "growixa-worker"
version = "0.1.0"
description = "Growixa background job worker"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "pydantic-settings>=2.6",
    "aio-pika>=9.4",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "cryptography>=43.0",
    "aiosmtplib>=3.0",
    "redis>=5.1",
    # Instagram Graph API calls for social publishing (Slice 5, GRX-SOCIAL-008).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-env>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growixa_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
addopts = "--cov=growixa_worker --cov-report=term-missing"
# !! CRITICAL: always target the isolated test DB, never the live dev `growixa` database.
# Tests run fixture teardowns that DELETE rows. Without this, running pytest wipes dev data.
env = [
    "ENVIRONMENT=test",
    "LOG_LEVEL=warning",
    "DATABASE_URL=postgresql+asyncpg://growixa:ci_pg_password@localhost:5432/growixa_test",
    "REDIS_URL=redis://localhost:6379/1",
    "RABBITMQ_URL=amqp://guest:ci_mq_password@localhost:5672/",
    "ENCRYPTION_KEY=U640ORbquCvIAZca0r5qqd173t669iSoJ3gSuoGGSr0=",
    "API_PUBLIC_URL=http://localhost:8000",
]
markers = [
    "integration: exercises a real backing service (RabbitMQ) — not a pure unit test; run alone via -m integration or exclude via -m 'not integration'",
]

[tool.coverage.run]
source = ["growixa_worker"]
omit = ["*/tests/*"]
