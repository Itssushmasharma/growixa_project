name: deploy-frontend-netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-frontend-netlify.yml"

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Netlify settings
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "Missing GitHub secret NETLIFY_AUTH_TOKEN" && exit 1)
          test -n "$NETLIFY_SITE_ID" || (echo "Missing GitHub secret NETLIFY_SITE_ID" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Type check
        run: npm run typecheck --prefix apps/web

      - name: Build web app
        run: npm run build --prefix apps/web

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --build --prod --dir=apps/web/.next --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
