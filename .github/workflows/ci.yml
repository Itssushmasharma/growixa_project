name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only-paths
      - "docs/**"
      - "pr_reviews/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "RELEASE_NOTES.md"
      - ".agents/**"
      - ".claude/**"
      - ".github/copilot-instructions.md"
  pull_request:
    branches: [main]
    paths-ignore: *docs-only-paths

# Cancel a still-running CI run for the same branch/PR when a newer commit lands, instead
# of letting superseded runs burn minutes to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ephemeral, CI-only credentials for throwaway service containers — not secrets, never
# reused outside this workflow. Real deployments get real secrets from a proper store.
env:
  POSTGRES_USER: growixa
  POSTGRES_PASSWORD: ci_pg_password
  POSTGRES_DB: growixa
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: ci_mq_password
  JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-prod-use

jobs:
  # Stages 1-5 of TEST_STRATEGY.md's "CI test stages": lint, format check, type check,
  # migration check, backend tests — for the backend. Runs against real GitHub Actions
  # service containers (unlike local dev, Redis IS host-reachable here, so the tests that
  # skip locally per GRX-FOUND-006's finding actually execute for real in CI).
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: growixa
          POSTGRES_PASSWORD: ci_pg_password
          POSTGRES_DB: growixa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growixa -d growixa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: ci_mq_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://growixa:ci_pg_password@localhost:5432/growixa
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:ci_mq_password@localhost:5672/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Format check
        working-directory: apps/api
        run: ruff format --check .

      - name: Type check
        working-directory: apps/api
        run: mypy .

      # Distinct from test_migrations.py's upgrade/downgrade round-trip (already covered
      # by the Tests step below) — `alembic check` catches a model changed without a
      # matching migration, which the round-trip test doesn't verify on its own.
      - name: Migration check
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        working-directory: apps/api
        run: pytest

  # Lint, format check, type check, tests for the worker. The test suite uses real Postgres
  # (integration-tier: fixtures insert rows, teardowns delete them) and requires the API's
  # Alembic migrations to have been applied so the schema and seed account exist. Redis is
  # needed for the idempotency-key checks in dispatch/social dispatch consumer tests.
  # RabbitMQ is NOT needed — the AMQP consumer is fully monkeypatched in all worker tests.
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: growixa
          POSTGRES_PASSWORD: ci_pg_password
          POSTGRES_DB: growixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growixa -d growixa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://growixa:ci_pg_password@localhost:5432/growixa_test
      REDIS_URL: redis://localhost:6379/1
      RABBITMQ_URL: amqp://guest:ci_mq_password@localhost:5672/
      ENCRYPTION_KEY: U640ORbquCvIAZca0r5qqd173t669iSoJ3gSuoGGSr0=
      API_PUBLIC_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            apps/worker/pyproject.toml
            apps/api/pyproject.toml

      - name: Install worker dependencies
        working-directory: apps/worker
        run: pip install -e ".[dev]"

      - name: Install API dependencies (needed to run migrations)
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Run API migrations
        working-directory: apps/api
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://growixa:ci_pg_password@localhost:5432/growixa_test

      - name: Lint
        working-directory: apps/worker
        run: ruff check .

      - name: Format check
        working-directory: apps/worker
        run: ruff format --check .

      - name: Type check
        working-directory: apps/worker
        run: mypy .

      - name: Tests
        working-directory: apps/worker
        run: pytest


  # Stages 1-3 and 6-7: lint, format check, type check, unit/component tests, build — for
  # the frontend. Independent of the backend job, so it runs in parallel.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Format check
        working-directory: apps/web
        run: npm run format:check

      - name: Type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit/component tests
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Stage 8: e2e smoke tests, against the real Docker Compose stack (the same one used for
  # every manual verification throughout this project) — only runs once the cheaper
  # backend/frontend checks already passed, so a broken foundation never wastes time
  # standing up the full stack.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compose auto-tags this service's image as `<project>-api` (project name "growixa"
      # per compose.yaml's top-level `name:`) — building it here with the GitHub Actions
      # cache backend and loading it into the local daemon lets the later `docker compose
      # up` (no `--build`) reuse it instead of rebuilding from scratch every run.
      - name: Build api image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          tags: growixa-api:latest
          load: true
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api

      - name: Write Compose .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          POSTGRES_PORT=5432
          RABBITMQ_USER=${{ env.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ env.RABBITMQ_PASSWORD }}
          RABBITMQ_MGMT_PORT=15672
          API_PORT=8000
          WEB_PORT=3000
          JWT_SIGNING_KEY=${{ env.JWT_SIGNING_KEY }}
          ACCESS_TOKEN_TTL_MINUTES=15
          REFRESH_TOKEN_TTL_DAYS=30
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      # Only postgres/redis/rabbitmq/api — Playwright brings its own Next.js instance
      # (see apps/web/playwright.config.ts), so the `web` container isn't needed here.
      # No `--build`: the api image was already built (with cache) above.
      - name: Start backing services and the api
        run: docker compose up -d postgres redis rabbitmq api

      - name: Wait for the api to become healthy
        run: timeout 90 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          COMPOSE_BIN: docker
        run: npm run test:e2e

      - name: Tear down the Compose stack
        if: always()
        run: docker compose down -v

  # Telegram alert triggered ONLY if any CI job fails (Backend, Worker, Frontend, or E2E)
  notify-on-failure:
    name: Telegram Failure Alert
    needs: [backend, worker, frontend, e2e]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Determine Failed Stages
        id: diagnostics
        run: |
          FAILED=""
          if [ "${{ needs.backend.result }}" = "failure" ]; then FAILED="${FAILED}• Backend (lint, format, typecheck, pytest)\n"; fi
          if [ "${{ needs.worker.result }}" = "failure" ]; then FAILED="${FAILED}• Worker (lint, format, typecheck, tests)\n"; fi
          if [ "${{ needs.frontend.result }}" = "failure" ]; then FAILED="${FAILED}• Frontend (eslint, prettier, tsc, vitest, build)\n"; fi
          if [ "${{ needs.e2e.result }}" = "failure" ]; then FAILED="${FAILED}• E2E Smoke Tests (Playwright)\n"; fi
          if [ -z "$FAILED" ]; then FAILED="• Unhandled CI Failure\n"; fi
          echo "failed_stages<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram CI Failure Notification
        uses: iitdeveloper-git/iitdeveloper-git-shared-workflows/actions/telegram-notify@main
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "Growixa"
          environment: "CI / Tests"
          status: "failure"
          custom_message: "⚠️ Failed stage(s) on ${{ github.ref_name }}:%0A${{ steps.diagnostics.outputs.failed_stages }}"
