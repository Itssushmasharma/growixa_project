name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ephemeral, CI-only credentials for throwaway service containers — not secrets, never
# reused outside this workflow. Real deployments get real secrets from a proper store.
env:
  POSTGRES_USER: growixa
  POSTGRES_PASSWORD: ci_pg_password
  POSTGRES_DB: growixa
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: ci_mq_password
  JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-prod-use

jobs:
  # Stages 1-5 of TEST_STRATEGY.md's "CI test stages": lint, format check, type check,
  # migration check, backend tests — for the backend. Runs against real GitHub Actions
  # service containers (unlike local dev, Redis IS host-reachable here, so the tests that
  # skip locally per GRX-FOUND-006's finding actually execute for real in CI).
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ${{ env.RABBITMQ_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ env.RABBITMQ_PASSWORD }}
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://${{ env.RABBITMQ_USER }}:${{ env.RABBITMQ_PASSWORD }}@localhost:5672/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check .

      - name: Format check
        working-directory: apps/api
        run: ruff format --check .

      - name: Type check
        working-directory: apps/api
        run: mypy .

      # Distinct from test_migrations.py's upgrade/downgrade round-trip (already covered
      # by the Tests step below) — `alembic check` catches a model changed without a
      # matching migration, which the round-trip test doesn't verify on its own.
      - name: Migration check
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        working-directory: apps/api
        run: pytest

  # Lint, format check, type check, tests for the worker (GRX-FOUND-007). Its own test
  # suite is pure unit-level (a fake AMQP message, no real broker), so unlike `backend` it
  # needs no service containers; independent job, runs in parallel with backend/frontend.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install worker dependencies
        working-directory: apps/worker
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/worker
        run: ruff check .

      - name: Format check
        working-directory: apps/worker
        run: ruff format --check .

      - name: Type check
        working-directory: apps/worker
        run: mypy .

      - name: Tests
        working-directory: apps/worker
        run: pytest

  # Stages 1-3 and 6-7: lint, format check, type check, unit/component tests, build — for
  # the frontend. Independent of the backend job, so it runs in parallel.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Format check
        working-directory: apps/web
        run: npm run format:check

      - name: Type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit/component tests
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Stage 8: e2e smoke tests, against the real Docker Compose stack (the same one used for
  # every manual verification throughout this project) — only runs once the cheaper
  # backend/frontend checks already passed, so a broken foundation never wastes time
  # standing up the full stack.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Write Compose .env
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ env.POSTGRES_DB }}
          POSTGRES_PORT=5432
          RABBITMQ_USER=${{ env.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ env.RABBITMQ_PASSWORD }}
          RABBITMQ_MGMT_PORT=15672
          API_PORT=8000
          WEB_PORT=3000
          JWT_SIGNING_KEY=${{ env.JWT_SIGNING_KEY }}
          ACCESS_TOKEN_TTL_MINUTES=15
          REFRESH_TOKEN_TTL_DAYS=30
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      # Only postgres/redis/rabbitmq/api — Playwright brings its own Next.js instance
      # (see apps/web/playwright.config.ts), so the `web` container isn't needed here.
      - name: Start backing services and the api
        run: docker compose up -d --build postgres redis rabbitmq api

      - name: Wait for the api to become healthy
        run: timeout 90 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          COMPOSE_BIN: docker
        run: npm run test:e2e

      - name: Tear down the Compose stack
        if: always()
        run: docker compose down -v
