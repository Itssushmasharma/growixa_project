name: deploy-backend-huggingface

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "Dockerfile.space"
      - "start.sh"
      - ".github/workflows/deploy-backend-huggingface.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID || secrets.HF_SPACE_ID || 'iitdeveloper/growixa' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Hugging Face settings
        run: |
          test -n "$HF_TOKEN" || (echo "Missing GitHub secret HF_TOKEN" && exit 1)
          test -n "$HF_SPACE_ID" || (echo "Missing Hugging Face Space ID" && exit 1)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Space bundle
        run: |
          rm -rf /tmp/growixa-hf-space
          mkdir -p /tmp/growixa-hf-space/apps
          cp -R apps/api /tmp/growixa-hf-space/apps/
          cp -R apps/worker /tmp/growixa-hf-space/apps/
          cp Dockerfile.space /tmp/growixa-hf-space/Dockerfile
          cp start.sh /tmp/growixa-hf-space/start.sh
          chmod +x /tmp/growixa-hf-space/start.sh
          cat > /tmp/growixa-hf-space/README.md <<'EOF'
          ---
          title: Growixa Backend API & Worker
          sdk: docker
          app_port: 7860
          ---

          Growixa FastAPI backend and background worker deployed as a combined Hugging Face Docker Space.

          Required Space secrets:
          - DATABASE_URL
          - REDIS_URL
          - RABBITMQ_URL
          - JWT_SIGNING_KEY
          EOF

      - name: Upload bundle to Hugging Face Space
        run: |
          python -m pip install --upgrade huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_ID"]
          upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="/tmp/growixa-hf-space",
              token=token,
              commit_message="Deploy Growixa API + Worker from GitHub Actions",
          )
          PY
