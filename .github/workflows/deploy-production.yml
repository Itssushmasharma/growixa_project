name: deploy-production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v*.*.*-*'
      - '!*rc*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to deploy (e.g. v1.0.0)'
        required: true
        default: 'latest'
      source_rc_tag:
        description: 'UAT release-candidate tag to promote (e.g. v1.0.0-rc2). Leave blank to auto-derive as "<release_tag>-rc1".'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # "Build once, promote the same artifact" (standard practice): a production tag almost
  # always names the exact commit that already passed deploy-uat.yml's test suite and got
  # built into a UAT image. Re-running the tests and rebuilding from source here would
  # burn Actions minutes testing/building something already proven, and risks prod
  # running bytes that differ from what UAT actually verified (dependency resolution
  # drift, base-image updates between builds). So: check whether the matching RC images
  # exist in GHCR; if they do, retag them for production (no rebuild, no retest) in the
  # `promote` job below. Only fall back to the full `test` + `build-and-push` path when
  # no matching RC image is found — e.g. a production tag cut without a prior RC cycle,
  # or a version-number mismatch between the RC and the production tag (`source_rc_tag`
  # exists precisely for that case).
  resolve-source:
    name: Resolve promotable UAT image
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.tag }}
      source_tag: ${{ steps.vars.outputs.source }}
      promote: ${{ steps.check.outputs.promote }}
    steps:
      - name: Determine release and source RC tags
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          SOURCE="${{ github.event.inputs.source_rc_tag }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="${TAG}-rc1"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether all three UAT images exist for the source tag
        id: check
        run: |
          PROMOTE=true
          for svc in api worker web; do
            if ! docker buildx imagetools inspect \
              "ghcr.io/${{ github.repository_owner }}/growixa-$svc:${{ steps.vars.outputs.source }}" \
              > /dev/null 2>&1; then
              echo "No image found for growixa-$svc:${{ steps.vars.outputs.source }} — falling back to full test+build."
              PROMOTE=false
            fi
          done
          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"

  # Fallback path: only runs when resolve-source found no matching RC image to promote.
  test:
    name: Run Test Suite
    needs: [resolve-source]
    if: needs.resolve-source.outputs.promote != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: growixa
          POSTGRES_PASSWORD: growixa_test_secret
          POSTGRES_DB: growixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: growixa
          RABBITMQ_DEFAULT_PASS: growixa_test_secret
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://growixa:growixa_test_secret@localhost:5432/growixa_test
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://growixa:growixa_test_secret@localhost:5672/
      JWT_SIGNING_KEY: test-jwt-signing-secret-key-minimum-32-chars-long
      ENCRYPTION_KEY: n_fGvQkL3Hq5V2xQ8z9Y1w4A7e0R6u8I2o5P4s7D1f3=
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install --system -e "apps/api[dev]" -e "apps/worker[dev]"

      - name: Run Backend Pytest
        working-directory: apps/api
        run: |
          alembic upgrade head
          pytest

      - name: Run Worker Pytest
        working-directory: apps/worker
        run: pytest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Frontend Tests
        working-directory: apps/web
        run: npm run test

  # Fallback path: only runs when resolve-source found no matching RC image to promote.
  build-and-push:
    name: Build and Push Docker Images to GHCR
    needs: [resolve-source, test]
    if: needs.resolve-source.outputs.promote != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/growixa-api:${{ needs.resolve-source.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/growixa-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/growixa-worker:${{ needs.resolve-source.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/growixa-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/growixa-web:${{ needs.resolve-source.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/growixa-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Promote path: runs when resolve-source found the matching RC images already built
  # and pushed by deploy-uat.yml. Retags them for production — no rebuild, no retest.
  promote:
    name: Promote UAT images to production (no rebuild)
    needs: [resolve-source]
    if: needs.resolve-source.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag UAT images as the production release
        run: |
          for svc in api worker web; do
            docker buildx imagetools create \
              --tag "ghcr.io/${{ github.repository_owner }}/growixa-$svc:${{ needs.resolve-source.outputs.release_tag }}" \
              --tag "ghcr.io/${{ github.repository_owner }}/growixa-$svc:latest" \
              "ghcr.io/${{ github.repository_owner }}/growixa-$svc:${{ needs.resolve-source.outputs.source_tag }}"
          done

  deploy:
    name: Deploy to OVH VPS (Production)
    needs: [resolve-source, test, build-and-push, promote]
    if: |
      always() &&
      needs.resolve-source.result == 'success' &&
      (needs.promote.result == 'success' || needs.build-and-push.result == 'success')
    runs-on: ubuntu-latest

    concurrency:
      group: growixa-production-deployment
      cancel-in-progress: false

    steps:
      - name: Ensure target directory permissions on VPS (Production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER || 'ubuntu' }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          port: ${{ secrets.OVH_VPS_SSH_PORT || 22 }}
          script: |
            sudo mkdir -p /opt/growixa
            sudo chown -R ${{ secrets.OVH_VPS_USER || 'ubuntu' }}:${{ secrets.OVH_VPS_USER || 'ubuntu' }} /opt/growixa

      - uses: actions/checkout@v4

      - name: Sync deploy files to OVH VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER || 'ubuntu' }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          port: ${{ secrets.OVH_VPS_SSH_PORT || 22 }}
          source: "deploy/"
          target: "/opt/growixa/"
          strip_components: 0

      - name: Execute Production Deployment on OVH VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OVH_VPS_HOST }}
          username: ${{ secrets.OVH_VPS_USER || 'ubuntu' }}
          key: ${{ secrets.OVH_VPS_SSH_KEY }}
          port: ${{ secrets.OVH_VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            cd /opt/growixa
            chmod +x deploy/scripts/deploy_prod.sh
            ./deploy/scripts/deploy_prod.sh "${{ needs.resolve-source.outputs.release_tag }}"

  notify-success:
    name: Notify Deployment Success
    needs: [deploy]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Release Notes Summary
        id: notes
        run: |
          python3 - << 'PYEOF' >> $GITHUB_OUTPUT
          import re
          try:
              content = open('RELEASE_NOTES.md').read()
              matches = re.findall(r'^##\s+.*?(?=^##\s+|\Z)', content, flags=re.MULTILINE | re.DOTALL)
              if matches:
                  bullets = [line.strip() for line in matches[0].split('\n') if line.strip().startswith('- ')]
                  summary = "\n".join(bullets[:5])
                  if len(summary) > 600:
                      summary = summary[:597] + "..."
              else:
                  summary = ""
          except Exception:
              summary = ""
          print("summary<<EOF")
          print(summary)
          print("EOF")
          PYEOF

      - name: Send Telegram Release Notification
        uses: iitdeveloper-git/iitdeveloper-git-shared-workflows/actions/telegram-notify@main
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "Growixa"
          environment: "Production"
          status: "success"
          release_tag: ${{ github.ref_name }}
          app_url: "https://growixa.iitdeveloper.com"
          custom_message: ${{ steps.notes.outputs.summary }}

  notify-failure:
    name: Notify Deployment Failure
    needs: [resolve-source, test, build-and-push, promote, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Notification
        uses: iitdeveloper-git/iitdeveloper-git-shared-workflows/actions/telegram-notify@main
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "Growixa"
          environment: "Production"
          status: "failure"
          release_tag: ${{ github.ref_name }}
          app_url: "https://growixa.iitdeveloper.com"
          custom_message: "❌ Deployment pipeline failed during release rollout."
