services:
  api:
    image: ${API_IMAGE:-ghcr.io/iitdeveloper-git/growixa-api:uat}
    restart: unless-stopped
    networks:
      - iitd_data_network
      - iitd_edge_network
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://growixa:${POSTGRES_PASSWORD}@postgres:5432/growixa_uat}
      REDIS_URL: ${REDIS_URL:-redis://redis-growixa:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-growixa}:${RABBITMQ_PASSWORD}@rabbitmq:5672/}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://uat.growixa.iitdeveloper.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://uat.growixa.iitdeveloper.com/api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://uat.growixa.iitdeveloper.com}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@growixa.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_FULL_NAME: ${PLATFORM_ADMIN_FULL_NAME:-UAT Platform Admin}
      PLATFORM_SMTP_HOST: ${PLATFORM_SMTP_HOST:-}
      PLATFORM_SMTP_PORT: ${PLATFORM_SMTP_PORT:-587}
      PLATFORM_SMTP_USERNAME: ${PLATFORM_SMTP_USERNAME:-}
      PLATFORM_SMTP_PASSWORD: ${PLATFORM_SMTP_PASSWORD:-}
      PLATFORM_SMTP_FROM_EMAIL: ${PLATFORM_SMTP_FROM_EMAIL:-noreply@growixa.com}
      PLATFORM_SMTP_FROM_NAME: ${PLATFORM_SMTP_FROM_NAME:-Growixa UAT}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_GRAPH_API_VERSION: ${INSTAGRAM_GRAPH_API_VERSION:-v19.0}
      SUPABASE_STORAGE_URL: ${SUPABASE_STORAGE_URL:-}
      SUPABASE_STORAGE_SERVICE_ROLE_KEY: ${SUPABASE_STORAGE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-social-media}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/iitdeveloper-git/growixa-worker:uat}
    restart: unless-stopped
    networks:
      - iitd_data_network
    environment:
      ENVIRONMENT: uat
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://growixa:${POSTGRES_PASSWORD}@postgres:5432/growixa_uat}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-growixa}:${RABBITMQ_PASSWORD}@rabbitmq:5672/}
      REDIS_URL: ${REDIS_URL:-redis://redis-growixa:6379/0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://uat.growixa.iitdeveloper.com}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://uat.growixa.iitdeveloper.com/api}
      SUPABASE_STORAGE_URL: ${SUPABASE_STORAGE_URL:-}
      SUPABASE_STORAGE_SERVICE_ROLE_KEY: ${SUPABASE_STORAGE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-social-media}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  web:
    image: ${WEB_IMAGE:-ghcr.io/iitdeveloper-git/growixa-web:uat}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - iitd_edge_network
      - iitd_data_network
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

networks:
  iitd_data_network:
    name: iitd_data_network
    external: true
  iitd_edge_network:
    name: iitd_edge_network
    external: true
