repos:
  - repo: local
    hooks:
      - id: check-branch-name
        name: check branch name & forbid main commit
        entry: ./scripts/check_branch_name.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: api-ruff-check
        name: api - ruff check
        entry: bash -c 'cd apps/api && source .venv/bin/activate && ruff check .'
        language: system
        files: ^apps/api/
        pass_filenames: false

      - id: api-ruff-format
        name: api - ruff format --check
        entry: bash -c 'cd apps/api && source .venv/bin/activate && ruff format --check .'
        language: system
        files: ^apps/api/
        pass_filenames: false

      - id: api-mypy
        name: api - mypy
        entry: bash -c 'cd apps/api && source .venv/bin/activate && mypy .'
        language: system
        files: ^apps/api/
        pass_filenames: false

      - id: worker-ruff-check
        name: worker - ruff check
        entry: bash -c 'cd apps/worker && source .venv/bin/activate && ruff check .'
        language: system
        files: ^apps/worker/
        pass_filenames: false

      - id: worker-ruff-format
        name: worker - ruff format --check
        entry: bash -c 'cd apps/worker && source .venv/bin/activate && ruff format --check .'
        language: system
        files: ^apps/worker/
        pass_filenames: false

      - id: worker-mypy
        name: worker - mypy
        entry: bash -c 'cd apps/worker && source .venv/bin/activate && mypy .'
        language: system
        files: ^apps/worker/
        pass_filenames: false

      - id: web-eslint
        name: web - eslint
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        files: ^apps/web/
        pass_filenames: false

      - id: web-prettier
        name: web - prettier --check
        entry: bash -c 'cd apps/web && npm run format:check'
        language: system
        files: ^apps/web/
        pass_filenames: false

      - id: web-typecheck
        name: web - tsc --noEmit
        entry: bash -c 'cd apps/web && npm run typecheck'
        language: system
        files: ^apps/web/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: ^(apps/web/src/assets/|docs/03-ux-ui/mockups/)
      - id: detect-private-key
